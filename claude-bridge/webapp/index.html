<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 작업 브릿지</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mark" aria-hidden="true"></span>Claude 작업 브릿지</div>
  <div id="agents" class="agents"></div>
  <div id="meBox" class="me hidden"><span id="me"></span><button id="logout" type="button" class="btn ghost sm">로그아웃</button></div>
</header>

<div id="banner" class="banner hidden"></div>

<section id="login" class="login hidden">
  <form id="loginForm" class="card login-card" autocomplete="on">
    <h1>Claude 작업 브릿지</h1>
    <p class="muted">수정 요청을 올리면 연결된 PC의 Claude Code가 작업하고, 결과와 변경 내역(diff)을 이 화면으로 돌려줍니다.</p>
    <label>이름<input name="name" required maxlength="30" autocomplete="username"></label>
    <label>접속 비밀번호<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit">로그인</button>
    <p id="loginErr" class="err" role="alert"></p>
  </form>
</section>

<main id="app" class="layout hidden">
  <aside class="side">
    <form id="newForm" class="card">
      <h2>새 수정 요청</h2>
      <label>프로젝트
        <input name="project" list="projectList" required maxlength="60" placeholder="에이전트에 등록된 프로젝트 이름" autocomplete="off">
      </label>
      <datalist id="projectList"></datalist>
      <label><span>제목 <span class="opt">선택</span></span>
        <input name="title" maxlength="100" placeholder="비우면 요청 내용 첫 줄">
      </label>
      <label>요청 내용
        <textarea name="prompt" rows="7" required placeholder="예) 주문 목록 화면(orderList.jsp)에 '배송일' 컬럼을 추가해 주세요. 정렬은 기존처럼 주문일 내림차순."></textarea>
      </label>
      <div class="form-foot">
        <span id="agentHint" class="hint"></span>
        <button class="btn primary" type="submit">요청 등록 <kbd>Ctrl+Enter</kbd></button>
      </div>
    </form>

    <div class="card list-card">
      <div class="list-head">
        <h2>작업 목록</h2>
        <div class="seg" id="filter" role="tablist">
          <button type="button" data-f="all" class="on">전체</button>
          <button type="button" data-f="active">진행</button>
          <button type="button" data-f="done">완료</button>
          <button type="button" data-f="error">실패</button>
        </div>
      </div>
      <ul id="taskList" class="task-list"></ul>
    </div>
  </aside>

  <section id="detail" class="detail card">
    <div class="empty">
      <p><b>작업을 선택하세요.</b></p>
      <p class="muted">왼쪽에서 수정 요청을 등록하면 PC 에이전트가 가져가서 처리합니다. 진행 로그와 결과, 변경 diff 가 여기 표시됩니다.</p>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden" role="status"></div>

<script>
(function () {
  'use strict';
  var $ = function (s, el) { return (el || document).querySelector(s); };
  var STATUS = { pending: '대기', running: '실행 중', done: '완료', error: '실패', canceled: '취소됨' };
  var FINISHED = ['done', 'error', 'canceled'];
  var state = { user: null, tasks: [], agents: [], offset: 0, selectedId: null, detail: null, detailSig: '',
                logOpen: {}, drafts: {}, filter: 'all', tick: 0, busy: false };

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid == null || kid === false) return;
    if (Array.isArray(kid)) return kid.forEach(function (k) { append(el, k); });
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  function api(action, params, post) {
    var opt = { method: post ? 'POST' : 'GET', headers: { 'X-Bridge-UI': '1' }, credentials: 'same-origin', cache: 'no-store' };
    var url = 'api.jsp?action=' + encodeURIComponent(action);
    if (post) opt.body = new URLSearchParams(params || {});
    else if (params) url += '&' + new URLSearchParams(params);
    return fetch(url, opt).then(function (res) {
      return res.json().catch(function () { return { error: '서버 응답을 읽을 수 없습니다 (HTTP ' + res.status + ')' }; })
        .then(function (data) {
          if (res.status === 401 && action !== 'login') showLogin();
          if (!res.ok || data.error) throw new Error(data.error || 'HTTP ' + res.status);
          return data;
        });
    });
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 4000);
  }

  function banner(msg) {
    var b = $('#banner');
    b.textContent = msg || '';
    b.classList.toggle('hidden', !msg);
  }

  // ---------- 시간/형식 ----------
  function parseLocal(s) { return s ? new Date(s.replace(' ', 'T')) : null; }
  function ago(ms) {
    var sec = Math.max(0, Math.round((Date.now() + state.offset - ms) / 1000));
    if (sec < 60) return sec + '초 전';
    if (sec < 3600) return Math.floor(sec / 60) + '분 전';
    if (sec < 86400) return Math.floor(sec / 3600) + '시간 전';
    return Math.floor(sec / 86400) + '일 전';
  }
  function agoStr(s) { var d = parseLocal(s); return d ? ago(d.getTime()) : ''; }
  function dur(ms) {
    ms = Number(ms); if (!ms) return '';
    var s = Math.round(ms / 1000);
    return s < 60 ? s + '초' : Math.floor(s / 60) + '분 ' + (s % 60) + '초';
  }
  function statusLabel(t) { return t.status === 'running' && t.cancelRequested === '1' ? '취소 요청됨' : STATUS[t.status] || t.status; }

  // ---------- 화면 전환 ----------
  function showLogin() {
    state.user = null;
    $('#app').classList.add('hidden');
    $('#meBox').classList.add('hidden');
    $('#agents').replaceChildren();
    $('#login').classList.remove('hidden');
    var f = $('#loginForm');
    if (!f.elements.name.value) f.elements.name.value = store('bridge.name') || '';
    (f.elements.name.value ? f.elements.password : f.elements.name).focus();
  }
  function showApp() {
    $('#login').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#meBox').classList.remove('hidden');
    $('#me').textContent = state.user;
    var f = $('#newForm');
    if (!f.elements.project.value) f.elements.project.value = store('bridge.project') || '';
  }

  // ---------- 에이전트 상태 ----------
  function applyStatus(s) {
    state.user = s.user;
    state.agents = s.agents || [];
    state.offset = s.serverTime - Date.now();
    renderAgents();
  }
  function renderAgents() {
    var box = $('#agents');
    var online = state.agents.filter(function (a) { return a.online; });
    if (!state.agents.length) box.replaceChildren(h('span', { class: 'chip off' }, h('i'), '연결된 에이전트 없음'));
    else box.replaceChildren.apply(box, state.agents.map(function (a) {
      var label = a.online ? (a.busy ? '작업 중 #' + a.busy : '대기 중') : '오프라인 · ' + ago(a.lastSeen);
      return h('span', { class: 'chip ' + (a.online ? (a.busy ? 'busy' : 'on') : 'off'), title: '프로젝트: ' + (a.projects || '-') },
        h('i'), h('b', null, a.name), ' ', label);
    }));
    var projects = {};
    state.agents.forEach(function (a) { (a.projects || '').split(',').forEach(function (p) { if (p) projects[p] = 1; }); });
    $('#projectList').replaceChildren.apply($('#projectList'), Object.keys(projects).map(function (p) { return h('option', { value: p }); }));
    $('#agentHint').textContent = online.length ? '' : '온라인 에이전트가 없습니다. 요청은 대기열에 쌓였다가 PC가 연결되면 처리됩니다.';
  }

  // ---------- 목록 ----------
  function matchFilter(t) {
    if (state.filter === 'active') return t.status === 'pending' || t.status === 'running';
    if (state.filter === 'done') return t.status === 'done';
    if (state.filter === 'error') return t.status === 'error' || t.status === 'canceled';
    return true;
  }
  function renderList() {
    var list = $('#taskList');
    var rows = state.tasks.filter(matchFilter);
    if (!rows.length) return list.replaceChildren(h('li', { class: 'none' }, state.tasks.length ? '해당하는 작업이 없습니다.' : '아직 등록된 요청이 없습니다.'));
    list.replaceChildren.apply(list, rows.map(function (t) {
      return h('li', { class: 'task' + (t.id === state.selectedId ? ' sel' : ''), tabindex: '0',
                       onclick: function () { select(t.id); },
                       onkeydown: function (e) { if (e.key === 'Enter') select(t.id); } },
        h('span', { class: 'dot s-' + t.status }),
        h('div', { class: 't-main' },
          h('div', { class: 't-title' }, h('span', { class: 't-id' }, '#' + t.id), t.title),
          h('div', { class: 't-meta' }, t.project + ' · ' + t.requester + ' · ' + agoStr(t.createdAt))),
        h('span', { class: 'badge s-' + t.status }, statusLabel(t)));
    }));
  }

  // ---------- 상세 ----------
  function select(id) {
    if (state.selectedId !== id) state.detailSig = '';
    state.selectedId = id;
    if (location.hash !== '#task-' + id) history.replaceState(null, '', '#task-' + id);
    renderList();
    loadDetail(true).then(function () {
      if (window.innerWidth < 900) $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  function loadDetail(force) {
    var id = state.selectedId;
    if (!id) return Promise.resolve();
    var row = state.tasks.filter(function (t) { return t.id === id; })[0];
    var live = !row || row.status === 'pending' || row.status === 'running';
    if (!force && !live && state.detail && state.detail.id === id && state.detail.status === row.status && state.detail.finishedAt === row.finishedAt) return Promise.resolve();
    return api('get', { id: id }).then(function (r) {
      if (id !== state.selectedId) return;
      var sig = JSON.stringify(r.task);
      if (sig === state.detailSig) return;
      state.detailSig = sig;
      state.detail = r.task;
      renderDetail();
    }).catch(function (e) { toast(e.message); });
  }

  function section(title, body, extra) {
    return h('section', { class: 'sec' }, h('h3', null, title, extra || null), body);
  }

  // Claude 결과용 최소 마크다운 렌더러. innerHTML 을 쓰지 않고 DOM 으로 만들어 XSS 를 막는다.
  function inline(text) {
    var out = [], re = /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push(text.slice(last, m.index));
      out.push(m[1] ? h('code', null, m[1].slice(1, -1)) : h('strong', null, m[2].slice(2, -2)));
      last = re.lastIndex;
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
  }
  var MD = { fence: /^\s*```/, head: /^(#{1,6})\s+(.*)$/, hr: /^\s*(-{3,}|\*{3,}|_{3,})\s*$/,
             item: /^(\s*)([-*+]|\d+[.)])\s+(.*)$/, tsep: /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/ };
  function cells(line) { return line.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); }
  function markdown(text) {
    var root = h('div', { class: 'md' }), lines = text.replace(/\r\n/g, '\n').split('\n'), i = 0, m, buf;
    var isTable = function (k) { return /^\s*\|/.test(lines[k]) && k + 1 < lines.length && MD.tsep.test(lines[k + 1]); };
    var isBlock = function (k) { var l = lines[k]; return !l.trim() || MD.fence.test(l) || MD.head.test(l) || MD.hr.test(l) || MD.item.test(l) || isTable(k); };
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if (MD.fence.test(line)) {
        buf = []; i++;
        while (i < lines.length && !MD.fence.test(lines[i])) buf.push(lines[i++]);
        i++;
        root.append(h('pre', { class: 'code' }, buf.join('\n')));
      } else if ((m = MD.head.exec(line))) {
        root.append(h(m[1].length <= 2 ? 'h4' : m[1].length === 3 ? 'h5' : 'h6', null, inline(m[2])));
        i++;
      } else if (MD.hr.test(line)) {
        root.append(h('hr')); i++;
      } else if (isTable(i)) {
        var head = cells(line); i += 2;
        var body = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
        root.append(h('div', { class: 'tbl' }, h('table', null,
          h('thead', null, h('tr', null, head.map(function (c) { return h('th', null, inline(c)); }))),
          h('tbody', null, body.map(function (r) { return h('tr', null, r.map(function (c) { return h('td', null, inline(c)); })); })))));
      } else if ((m = MD.item.exec(line))) {
        var ordered = /\d/.test(m[2]), list = h(ordered ? 'ol' : 'ul');
        while (i < lines.length && (m = MD.item.exec(lines[i]))) {
          list.append(h('li', { style: m[1].length >= 2 ? 'margin-left:' + Math.floor(m[1].length / 2) * 1.2 + 'em' : null }, inline(m[3])));
          i++;
        }
        root.append(list);
      } else {
        var p = h('p');
        do {
          if (p.childNodes.length) p.append(h('br'));
          append(p, inline(lines[i++]));
        } while (i < lines.length && !isBlock(i));
        root.append(p);
      }
    }
    return root;
  }

  function diffView(diff) {
    var inner = h('div', { class: 'diff-inner' });
    var pre = h('pre', { class: 'code diff' }, inner);
    var lines = diff.split('\n');
    var MAX = 6000;
    lines.slice(0, MAX).forEach(function (line) {
      var c = null;
      if (line.indexOf('diff --git') === 0) c = 'd-file';
      else if (line.indexOf('+++') === 0 || line.indexOf('---') === 0) c = 'd-hdr';
      else if (line.indexOf('@@') === 0) c = 'd-hunk';
      else if (line[0] === '+') c = 'd-add';
      else if (line[0] === '-') c = 'd-del';
      else if (/^(index |new file|deleted file|similarity|rename |Binary|\\ No newline)/.test(line)) c = 'd-meta';
      inner.append(h('span', { class: c }, line || ' '));
    });
    if (lines.length > MAX) inner.append(h('span', { class: 'd-meta' }, '… ' + (lines.length - MAX) + '줄 더 있음 (.patch 받기로 전체 확인)'));
    return pre;
  }

  function filesView(files) {
    return h('ul', { class: 'files' }, files.split('\n').filter(Boolean).map(function (line) {
      var parts = line.split('\t');
      var st = parts[0].charAt(0);
      var name = parts.slice(1).join(' → ');
      return h('li', null, h('span', { class: 'fs fs-' + st, title: { A: '추가', M: '수정', D: '삭제', R: '이름 변경' }[st] || st }, st), h('code', null, name));
    }));
  }

  function action(label, cls, fn) {
    return h('button', { type: 'button', class: 'btn ' + cls, onclick: function (e) {
      var b = e.currentTarget; b.disabled = true;
      Promise.resolve(fn()).catch(function (err) { toast(err.message); }).then(function () { b.disabled = false; });
    } }, label);
  }

  function downloadPatch(t) {
    var url = URL.createObjectURL(new Blob([t.diff], { type: 'text/x-diff' }));
    var a = h('a', { href: url, download: 'task-' + t.id + '.patch' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function taskAction(name, t, confirmMsg) {
    if (confirmMsg && !confirm(confirmMsg)) return;
    return api(name, { id: t.id }, true).then(function () { return refresh(true); });
  }

  function renderDetail() {
    var t = state.detail;
    var box = $('#detail');
    var oldLog = $('.log', box);
    var logAtBottom = !oldLog || oldLog.scrollTop + oldLog.clientHeight >= oldLog.scrollHeight - 8;
    var logTop = oldLog ? oldLog.scrollTop : 0;
    var scrollTop = box.scrollTop;
    var running = t.status === 'running' || t.status === 'pending';
    var finished = FINISHED.indexOf(t.status) >= 0;

    var actions = [];
    if (running) actions.push(action(t.cancelRequested === '1' ? '강제 중단' : '취소', 'danger',
      function () { return taskAction('cancel', t, t.cancelRequested === '1' ? '에이전트 응답 없이 작업을 취소 상태로 바꿉니다. 계속할까요?' : null); }));
    if (finished) actions.push(action('다시 실행', 'ghost', function () { return taskAction('retry', t, '같은 요청을 처음부터 다시 실행합니다. 이전 결과는 지워집니다.'); }));
    if (t.diff) actions.push(action('.patch 받기', 'ghost', function () { downloadPatch(t); }));

    var meta = [['요청자', t.requester], ['등록', t.createdAt], ['시작', t.startedAt], ['종료', t.finishedAt],
                ['에이전트', t.agent], ['소요', dur(t.durationMs)], ['비용', t.costUsd ? '$' + t.costUsd : ''], ['턴', t.numTurns]]
      .filter(function (m) { return m[1]; });

    var children = state.tasks.filter(function (x) { return x.parentId === String(t.id); });
    var lineage = [];
    if (t.parentId) lineage.push(h('a', { href: '#task-' + t.parentId }, '← #' + t.parentId + ' 에서 이어진 작업'));
    children.forEach(function (c) { lineage.push(h('a', { href: '#task-' + c.id }, '→ #' + c.id + ' 추가 지시 (' + statusLabel(c) + ')')); });

    var parts = [
      h('div', { class: 'd-head' },
        h('div', { class: 'd-title' },
          h('div', { class: 'd-sub' }, '#' + t.id + ' · ' + t.project),
          h('h2', null, t.title)),
        h('span', { class: 'badge lg s-' + t.status }, statusLabel(t))),
      h('dl', { class: 'meta' }, meta.map(function (m) { return h('div', null, h('dt', null, m[0]), h('dd', null, m[1])); })),
      lineage.length ? h('div', { class: 'lineage' }, lineage) : null,
      actions.length ? h('div', { class: 'actions' }, actions) : null,
    ];

    if (t.status === 'pending') parts.push(h('div', { class: 'state-note' }, h('span', { class: 'spinner' }), 'PC 에이전트가 가져가기를 기다리는 중입니다.'));
    if (t.status === 'running') {
      var lastLine = (t.log || '').trim().split('\n').pop() || '시작하는 중…';
      parts.push(h('div', { class: 'state-note run' }, h('span', { class: 'spinner' }),
        h('div', null, h('b', null, t.cancelRequested === '1' ? '취소 요청을 전달하는 중…' : 'Claude 가 작업 중입니다'), h('div', { class: 'last' }, lastLine))));
    }

    parts.push(section('요청 내용', h('pre', { class: 'prose' }, t.prompt)));
    if (t.result) {
      var res = markdown(t.result);
      res.className += ' result' + (t.status === 'done' ? '' : ' is-err');
      parts.push(section(t.status === 'done' ? 'Claude 결과' : '결과 / 오류', res));
    }
    if (t.denials) parts.push(section('권한이 없어 실행하지 못한 도구', h('div', { class: 'warn' },
      h('p', null, '아래 동작은 에이전트의 허용 목록(allowedTools)에 없어 거부되었습니다. 필요하면 agent.config.json 의 claude.allowedTools 에 추가하세요.'),
      h('pre', { class: 'code' }, t.denials))));
    if (t.files) parts.push(section('변경 파일', filesView(t.files)));
    if (t.diff) parts.push(section('변경 내역 (diff)', diffView(t.diff)));
    else if (t.status === 'done') parts.push(section('변경 내역 (diff)', h('p', { class: 'muted' }, '변경된 파일이 없습니다.')));

    if (t.log) {
      var det = h('details', { class: 'sec logbox', open: running || state.logOpen[t.id] ? true : null,
        ontoggle: function () { state.logOpen[t.id] = det.open; } },
        h('summary', null, '실행 로그 ', h('span', { class: 'muted' }, (t.log.split('\n').length) + '줄')),
        h('pre', { class: 'code log' }, t.log));
      parts.push(det);
    }

    if (finished) {
      var ta = h('textarea', { name: 'prompt', rows: '3', required: true, placeholder: '예) 컬럼 헤더 이름을 "배송 예정일"로 바꿔 주세요.',
        oninput: function () { state.drafts[t.id] = ta.value; } });
      ta.value = state.drafts[t.id] || '';
      var form = h('form', { class: 'followup', onsubmit: function (e) {
        e.preventDefault();
        var b = form.querySelector('button'); b.disabled = true;
        api('create', { parentId: t.id, project: t.project, prompt: ta.value.trim() }, true).then(function (r) {
          delete state.drafts[t.id];
          return refresh().then(function () { select(r.task.id); });
        }).catch(function (err) { toast(err.message); }).then(function () { b.disabled = false; });
      } },
        h('h3', null, '추가 지시'),
        h('p', { class: 'muted' }, t.sessionId ? 'Claude 가 이 작업의 대화 맥락을 이어받아 진행합니다.' : '이전 요청과 결과를 함께 전달해 새로 진행합니다.'),
        ta,
        h('div', { class: 'form-foot' }, h('span'), h('button', { class: 'btn primary', type: 'submit' }, '이어서 요청')));
      ta.addEventListener('keydown', submitOnCtrlEnter);
      parts.push(form);
    }

    box.replaceChildren.apply(box, parts.filter(Boolean));
    box.scrollTop = scrollTop;
    var newLog = $('.log', box);
    if (newLog) newLog.scrollTop = logAtBottom ? newLog.scrollHeight : logTop;
  }

  // ---------- 갱신 루프 ----------
  function refresh(forceDetail) {
    return Promise.all([api('status'), api('list')]).then(function (r) {
      if (!r[0].user) return showLogin();
      banner('');
      applyStatus(r[0]);
      state.tasks = r[1].tasks;
      renderList();
      return loadDetail(forceDetail);
    });
  }

  function loop() {
    if (!state.user || state.busy || document.hidden) return;
    state.tick++;
    var active = state.tasks.some(function (t) { return t.status === 'pending' || t.status === 'running'; });
    if (!active && state.tick % 4 !== 0) return;
    state.busy = true;
    refresh(false).catch(function (e) { banner('서버에 연결할 수 없습니다: ' + e.message); })
      .then(function () { state.busy = false; });
  }

  function fromHash() {
    var m = /^#task-(\d+)$/.exec(location.hash);
    if (m && state.user) select(Number(m[1]));
  }

  function submitOnCtrlEnter(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); e.target.form.requestSubmit(); }
  }

  // ---------- 이벤트 ----------
  $('#loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, b = f.querySelector('button');
    b.disabled = true; $('#loginErr').textContent = '';
    api('login', { name: f.elements.name.value.trim(), password: f.elements.password.value }, true).then(function (r) {
      state.user = r.user;
      store('bridge.name', r.user);
      f.elements.password.value = '';
      showApp();
      return refresh(true).then(fromHash);
    }).catch(function (err) { $('#loginErr').textContent = err.message; }).then(function () { b.disabled = false; });
  });

  $('#logout').addEventListener('click', function () {
    api('logout', {}, true).catch(function () {}).then(showLogin);
  });

  $('#newForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, el = f.elements, b = f.querySelector('button[type=submit]');
    b.disabled = true;
    api('create', { project: el.project.value.trim(), title: el.title.value.trim(), prompt: el.prompt.value.trim() }, true).then(function (r) {
      store('bridge.project', el.project.value.trim());
      el.title.value = ''; el.prompt.value = '';
      toast('#' + r.task.id + ' 요청을 등록했습니다.');
      return refresh().then(function () { select(r.task.id); });
    }).catch(function (err) { toast(err.message); }).then(function () { b.disabled = false; });
  });
  $('#newForm').elements.prompt.addEventListener('keydown', submitOnCtrlEnter);

  $('#filter').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
    renderList();
  });

  window.addEventListener('hashchange', fromHash);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && state.user) refresh(false).catch(function () {}); });

  api('status').then(function (s) {
    if (!s.user) return showLogin();
    applyStatus(s);
    showApp();
    return refresh(true).then(fromHash);
  }).catch(function (e) { banner('서버에 연결할 수 없습니다: ' + e.message); });
  setInterval(loop, 3000);
})();
</script>
</body>
</html>
